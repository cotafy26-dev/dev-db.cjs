# HERMES IA - stack completa (secao 34).
#   docker compose up --build
# Frontend: http://localhost:8080   API: http://localhost:3333

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hermes
      POSTGRES_PASSWORD: hermes
      POSTGRES_DB: hermes
    ports:
      - '5432:5432'
    volumes:
      - hermes_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hermes']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    profiles: ['queues']

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3333
      DATABASE_URL: postgresql://hermes:hermes@db:5432/hermes?schema=public
      WEB_ORIGIN: http://localhost:8080
      APP_URL: http://localhost:8080
      API_URL: http://localhost:3333
      JWT_SECRET: ${JWT_SECRET:-troque-este-segredo-em-producao-0123456789}
      AI_PROVIDER: ${AI_PROVIDER:-stub}
      AI_BASE_URL: ${AI_BASE_URL:-http://host.docker.internal:11434/v1}
      AI_API_KEY: ${AI_API_KEY:-ollama}
      AI_MODEL: ${AI_MODEL:-hermes3:8b}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_MODE: ${TELEGRAM_MODE:-polling}
      WHATSAPP_ENABLED: ${WHATSAPP_ENABLED:-false}
      WHATSAPP_API_URL: ${WHATSAPP_API_URL:-https://graph.facebook.com/v21.0}
      WHATSAPP_API_TOKEN: ${WHATSAPP_API_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
      REDIS_URL: ${REDIS_URL:-}
    ports:
      - '3333:3333'
    extra_hosts:
      - 'host.docker.internal:host-gateway'

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      - backend
    ports:
      - '8080:80'

volumes:
  hermes_pg:
