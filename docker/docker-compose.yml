# Postgres local opcional. Por padrao o projeto usa Postgres na nuvem
# (Neon / Supabase) via DATABASE_URL no .env.
#
# Uso:
#   docker compose -f docker/docker-compose.yml up -d
#   DATABASE_URL=postgresql://hermes:hermes@localhost:5432/hermes?schema=public

services:
  db:
    image: postgres:16-alpine
    container_name: hermes-db
    environment:
      POSTGRES_USER: hermes
      POSTGRES_PASSWORD: hermes
      POSTGRES_DB: hermes
    ports:
      - '5432:5432'
    volumes:
      - hermes_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hermes']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  hermes_pg:
