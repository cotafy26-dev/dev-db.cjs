# Postgres local opcional. Por padrao o projeto usa Postgres na nuvem
# (Neon / Supabase) via DATABASE_URL no .env.
#
# Uso:
#   docker compose -f docker/docker-compose.yml up -d
#   DATABASE_URL=postgresql://tato:tato@localhost:5432/tato?schema=public

services:
  db:
    image: postgres:16-alpine
    container_name: tato-db
    environment:
      POSTGRES_USER: tato
      POSTGRES_PASSWORD: tato
      POSTGRES_DB: tato
    ports:
      - '5432:5432'
    volumes:
      - tato_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tato']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tato_pg:
